[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "topoforge-ai"
version = "0.1.0"
description = "Network architecture diagrams and descriptions to deployable cloud infrastructure"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "networkx>=3.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
]
orchestration = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
]
vision = [
    "ultralytics>=8.2",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "scikit-image>=0.23",
    "paddleocr>=2.7",
]
llm = [
    "openai>=1.30",
    "anthropic>=0.28",
]
rag = [
    # The active net2tf RAG's own requirements.txt: groq, sentence-transformers, numpy.
    # numpy is already a base dependency. torch/transformers arrive transitively through
    # sentence-transformers only when the "hybrid" retrieval backend is used; the
    # "lexical" backend (custom BM25, no embeddings) needs neither. No jinja2, faiss or
    # scikit-learn: the RAG's Terraform/Ansible rendering moved to legacy/ and is not
    # invoked, and its retrieval uses a hand-rolled BM25, not faiss.
    "groq>=0.9",
    "sentence-transformers>=3.0",
]
storage = ["boto3>=1.34"]
observability = ["structlog>=24.1", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "requires_weights: needs TOPOFORGE_YOLO_WEIGHTS_PATH to point at real YOLO weights",
    "requires_rag: needs the external net2tf_v3 RAG available",
    "requires_db: needs a live PostgreSQL",
    "requires_terraform: needs the terraform binary",
    "slow: long-running",
]
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "apps", "workers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"src/infrastructure/rag/loader.py" = ["S403", "S301"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "(^external/|^apps/web/|migrations/)"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
